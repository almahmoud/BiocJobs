name: BiocJobs
description: >-
  Generate a package's BiocJobs wrappers inside its container image, built
  here unless the jobs declare one, and lint and test the Galaxy tools with
  planemo.
branding:
  icon: package
  color: blue

inputs:
  package-dir:
    description: Package source directory, relative to the workspace.
    default: .
  dockerfile:
    description: >-
      Dockerfile that builds the package image. Empty uses the action's own
      Dockerfile, which installs the package, its dependencies and BiocJobs
      on base-image.
    default: ""
  docker-context:
    description: Build context for the image. Defaults to package-dir.
    default: ""
  base-image:
    description: >-
      Base image for the action's Dockerfile. Defaults to
      ghcr.io/bioconductor/bioconductor at the branch name when that is
      devel or RELEASE_x_y, otherwise devel.
    default: ""
  reclaim-disk:
    description: >-
      Remove preinstalled toolchains from the runner first; Bioconductor
      images need the space.
    default: "true"
  image-name:
    description: >-
      Image name without a tag. Defaults to ghcr.io/<repository>, lowercased.
    default: ""
  image-tag:
    description: >-
      Image tag. Defaults to the branch or tag name with characters Docker
      rejects replaced by "-".
    default: ""
  push-image:
    description: >-
      Push the image after building it. Skipped for pull requests, whose
      token cannot write packages.
    default: "true"
  registry:
    description: Registry to log in to before pushing.
    default: ghcr.io
  registry-username:
    description: Registry user.
    default: ${{ github.actor }}
  registry-password:
    description: >-
      Registry password or token. The default token can push to GHCR when
      the job grants `packages: write`.
    default: ${{ github.token }}
  job-names:
    description: >-
      Space-separated job names to generate wrappers for. Empty means every
      job the package declares.
    default: ""
  artifact-name:
    description: Name of the uploaded wrapper artifact.
    default: biocjobs-wrappers
  report-name:
    description: >-
      File name of the planemo HTML report, uploaded unzipped under that
      name so it opens in the browser. Must be unique within the run.
    default: planemo-report.html
  run-planemo:
    description: Lint the generated Galaxy tools and run their tests.
    default: "true"
  planemo-version:
    description: planemo version to install.
    default: "0.75.47"
  galaxy-branch:
    description: Galaxy release branch planemo tests against.
    default: release_26.1
  python-version:
    description: Python version for planemo and Galaxy.
    default: "3.11"

outputs:
  image:
    description: >-
      Image built here and written into the wrappers of jobs that declare no
      container. Digest-pinned when pushed, otherwise name:tag; empty when
      every job declares its container.
    value: ${{ steps.ref.outputs.image }}
  wrappers:
    description: Directory holding the generated wrappers.
    value: ${{ steps.generate.outputs.dir }}

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.reclaim-disk == 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/share/powershell /usr/local/share/boost \
          /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
        df -h /

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Plan the image and jobs
      id: plan
      shell: bash
      env:
        NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.image-tag }}
        WANT_PUSH: ${{ inputs.push-image }}
        EVENT: ${{ github.event_name }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CONTEXT: ${{ inputs.docker-context }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        BASE_IMAGE: ${{ inputs.base-image }}
        JOB_NAMES: ${{ inputs.job-names }}
      run: |
        set -euo pipefail
        base="$BASE_IMAGE"
        if [ -z "$base" ]; then
          case "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" in
            devel|RELEASE_[0-9]*_[0-9]*)
              base="ghcr.io/bioconductor/bioconductor:${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" ;;
            *) base=ghcr.io/bioconductor/bioconductor:devel ;;
          esac
        fi
        # Registries accept lowercase repository names only.
        name="${NAME:-ghcr.io/$GITHUB_REPOSITORY}"
        name="${name,,}"
        tag=$(printf '%s' "${TAG:-$GITHUB_REF_NAME}" \
              | tr -c 'A-Za-z0-9._-' '-' | sed -E 's/^[^A-Za-z0-9_]+//' \
              | cut -c1-128)
        if [ -z "$tag" ]; then
          echo "::error::Cannot derive an image tag from '$GITHUB_REF_NAME'; set image-tag."
          exit 1
        fi
        # A job that declares its container runs in it; an image is built only
        # for jobs that declare none, or declare the image built here.
        python -m pip install --quiet --disable-pip-version-check pyyaml
        jobs_file="$RUNNER_TEMP/biocjobs-jobs.tsv"
        # shellcheck disable=SC2086 # job names are space-separated
        python "$GITHUB_ACTION_PATH/scripts/plan_jobs.py" "$PACKAGE_DIR" "$name" $JOB_NAMES > "$jobs_file"
        build=false
        while IFS=$'\t' read -r job image; do
          if [ -n "$image" ]; then
            echo "$job: declared container $image"
          else
            echo "$job: image built by this action"
            build=true
          fi
        done < "$jobs_file"
        push=false
        if [ "$build" = "true" ] && [ "$WANT_PUSH" = "true" ] && [ "$EVENT" != "pull_request" ]; then
          push=true
        fi
        {
          echo "name=$name"
          echo "tag=$tag"
          echo "push=$push"
          echo "dockerfile=${DOCKERFILE:-$GITHUB_ACTION_PATH/Dockerfile}"
          echo "context=${CONTEXT:-$PACKAGE_DIR}"
          echo "base=$base"
          echo "build=$build"
          echo "jobs-file=$jobs_file"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to the registry
      uses: docker/login-action@v4
      if: steps.plan.outputs.push == 'true'
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      if: steps.plan.outputs.build == 'true'

    - name: Build the package image
      uses: docker/build-push-action@v7
      if: steps.plan.outputs.build == 'true'
      with:
        context: ${{ steps.plan.outputs.context }}
        file: ${{ steps.plan.outputs.dockerfile }}
        build-args: BASE_IMAGE=${{ steps.plan.outputs.base }}
        load: true
        tags: ${{ steps.plan.outputs.name }}:${{ steps.plan.outputs.tag }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Push the image and resolve its reference
      id: ref
      if: steps.plan.outputs.build == 'true'
      shell: bash
      env:
        NAME: ${{ steps.plan.outputs.name }}
        IMAGE: ${{ steps.plan.outputs.name }}:${{ steps.plan.outputs.tag }}
        PUSH: ${{ steps.plan.outputs.push }}
      run: |
        set -euo pipefail
        echo "tagged=$IMAGE" >> "$GITHUB_OUTPUT"
        if [ "$PUSH" = "true" ]; then
          docker push "$IMAGE"
          # Pin the wrappers to the digest so they name exactly this build.
          digest=$(docker inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE" \
                   | grep -m1 "^$NAME@")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
        else
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate wrappers
      id: generate
      shell: bash
      env:
        IMAGE: ${{ steps.ref.outputs.tagged }}
        PINNED: ${{ steps.ref.outputs.image }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        JOBS_FILE: ${{ steps.plan.outputs.jobs-file }}
        OUT_DIR: ${{ runner.temp }}/biocjobs-wrappers
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        "${{ github.action_path }}/scripts/generate.sh"
        echo "dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
        {
          echo "### BiocJobs wrappers"
          echo
          echo "| Job | Image |"
          echo "|---|---|"
          while IFS=$'\t' read -r job image; do
            echo "| \`$job\` | \`${image:-$PINNED}\` |"
          done < "$JOBS_FILE"
          echo
          echo "Wrappers are in the \`$ARTIFACT\` artifact."
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload wrappers
      uses: actions/upload-artifact@v7
      if: always() && steps.generate.outcome == 'success'
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.generate.outputs.dir }}
        if-no-files-found: error
        retention-days: 30

    - name: Install planemo
      if: inputs.run-planemo == 'true'
      shell: bash
      env:
        PLANEMO_VERSION: ${{ inputs.planemo-version }}
      run: pip install "planemo==$PLANEMO_VERSION"

    - name: Lint and test Galaxy tools with planemo
      id: planemo
      if: inputs.run-planemo == 'true'
      shell: bash
      env:
        WRAPPERS_DIR: ${{ steps.generate.outputs.dir }}
        REPORT_HTML: ${{ runner.temp }}/${{ inputs.report-name }}
        GALAXY_BRANCH: ${{ inputs.galaxy-branch }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: "${{ github.action_path }}/scripts/planemo-test.sh"

    - name: Upload planemo report
      uses: actions/upload-artifact@v7
      if: always() && steps.planemo.outputs.report != ''
      with:
        path: ${{ steps.planemo.outputs.report }}
        archive: false
        retention-days: 30
