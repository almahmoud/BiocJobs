# Builds the package image, generates the BiocJobs wrappers inside it and
# tests the Galaxy tool. Wrappers are downloadable from the run's artifacts.
name: BiocJobs

on:
  push:
    branches: [devel, RELEASE_*]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # weekly, so the image follows its base tag
  workflow_dispatch:

concurrency:
  group: biocjobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biocjobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: almahmoud/BiocJobs/biocjobs-action@main
