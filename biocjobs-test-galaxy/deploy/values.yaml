useSecretConfigs: true
persistence:
  existingClaim: tgx-galaxy-data
  accessMode: ReadWriteOnce
  storageClass: local-path
  size: 20Gi
nodeSelector:
  kubernetes.io/hostname: am-binary-building-workers-2
jobs:
  priorityClass:
    enabled: false
ingress:
  enabled: true
  ingressClassName: traefik
  canary:
    enabled: false
  annotations: {}
  path: /
  hosts:
    - host: testgalaxy.bioconductor.org
      paths:
        - path: /
  tls:
    - hosts: [testgalaxy.bioconductor.org]
      secretName: testgalaxy-bioconductor-org
tusd:
  ingress:
    ingressClassName: traefik
    annotations: {}
postgresql:
  enabled: true
  deploy: false
  existingDatabase: "tgx-postgres:5432"
  galaxyDatabaseUser: galaxydbuser
  galaxyExistingSecret: tgx-postgres-creds
  galaxyExistingSecretKeyRef: POSTGRES_PASSWORD
  galaxyConnectionParams: ""
rabbitmq:
  enabled: true
  deploy: false
  existingCluster: tgx-rabbitmq
  existingSecret: tgx-rabbitmq-default-user
  protocol: amqp
  port: 5672
refdata:
  enabled: false
cvmfs:
  deploy: false
s3csi:
  deploy: false
setupJob:
  downloadToolConfs:
    enabled: false
extraVolumes:
  - name: oidc
    secret:
      secretName: tgx-oidc
extraVolumeMounts:
  - name: oidc
    mountPath: /galaxy/server/config/oidc
    readOnly: true
configs:
  galaxy.yml:
    galaxy:
      brand: Bioc Jobs Test
      admin_users: almahmoud@channing.harvard.edu
      require_login: false
      enable_quotas: true
      enable_oidc: true
      oidc_config_file: /galaxy/server/config/oidc/oidc_config.xml
      oidc_backends_config_file: /galaxy/server/config/oidc/oidc_backends_config.xml
      interactivetools_enable: false
  job_conf.yml:
    runners:
      k8s:
        k8s_node_selector: "kubernetes.io/hostname: am-binary-building-workers-2"
    limits:
      - type: anonymous_user_concurrent_jobs
        value: 2
