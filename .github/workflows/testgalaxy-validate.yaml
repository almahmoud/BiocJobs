name: Validate tools

on:
  pull_request:
    paths:
      - "biocjobs-test-galaxy/**"
      - ".github/workflows/testgalaxy-validate.yaml"
  push:
    branches: [main]
    paths:
      - "biocjobs-test-galaxy/**"
      - ".github/workflows/testgalaxy-validate.yaml"

permissions:
  contents: read

jobs:
  validate:
    # /deploy looks for a successful check with this name.
    name: Validate tools
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: biocjobs-test-galaxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.0.5

      - name: Check repository rules
        run: python3 .github/scripts/validate_tools.py tools examples

      - name: Install Planemo
        run: python -m pip install "planemo==0.75.47"

      - name: Lint
        run: |
          shopt -s nullglob
          wrappers=(tools/*/*.xml examples/*/*.xml)
          if [ "${#wrappers[@]}" -gt 0 ]; then
            planemo lint --fail_level error "${wrappers[@]}"
          fi

      - name: Check containers
        run: bash .github/scripts/check_containers.sh tools examples

      - name: Render Helm values
        run: |
          python3 .github/scripts/render_values.py \
            --values "$RUNNER_TEMP/tools-values.json" \
            --manifest "$RUNNER_TEMP/tools.tsv" \
            --skipped "$RUNNER_TEMP/skipped.tsv" \
            main=tools
          helm repo add cloudve https://raw.githubusercontent.com/CloudVE/helm-charts/master
          helm template tgx cloudve/galaxy --version 5.14.3 --namespace testgalaxy \
            --values deploy/values.yaml --values "$RUNNER_TEMP/tools-values.json" \
            --kube-version 1.34 > /dev/null
