# Copy to .github/workflows/biocjobs.yml in a Bioconductor package that
# declares jobs under inst/biocjobs/.
#
# The permissions block is required here rather than in the reusable
# workflow: a called workflow can only downgrade what its caller grants.
name: BiocJobs

on:
  push:
    branches: [devel, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  biocjobs:
    permissions:
      contents: read
      packages: write
    uses: almahmoud/BiocJobs/.github/workflows/biocjobs-package.yml@main
    # with:
    #   dockerfile: .github/docker/Dockerfile
    #   job-names: my-analysis           # default: every declared job
    #   run-planemo: true
